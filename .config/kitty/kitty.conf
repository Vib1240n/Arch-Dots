# Background
background #0d0d0d
background_opacity 0.9
background_blur 30
window_border_width 2pt
# active_border_color #7aa2f7
# Font
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
# allow_remote_control no

# Cursor
cursor_shape underline
cursor #fea639
cursor_blink_interval 0

# Shell
shell zsh
shell_integration enabled

# Selection/Copy
copy_on_select clipboard

# Terminal type
term xterm-256color

# Window
window_padding_width 15

# Tab bar
tab_bar_edge top
tab_bar_style powerline

# Scrollback
scrollback_lines 100000

# Mouse
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
detect_urls yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Keybindings
map ctrl+shift+a load_config_file
map Alt+Tab send_text all \x1b\r

# Colors
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5

color0 #15161e
color8 #414868
color1 #f7768e
color9 #f7768e
color2 #9ece6a
color10 #9ece6a
color3 #e0af68
color11 #e0af68
color4 #7aa2f7
color12 #7aa2f7
color5 #bb9af7
color13 #bb9af7
color6 #7dcfff
color14 #7dcfff
color7 #a9b1d6
color15 #c0caf5

confirm_os_window_close 0
# map opt+cmd+space send_text all \x00
# ----------------------------------------------------------------------------
# MACOS / KEYD COMPATIBILITY
# ----------------------------------------------------------------------------
# Because 'keyd' converts Super+C -> Ctrl+C before it reaches Kitty,
# Kitty thinks you are pressing Ctrl+C (Interrupt). We must remap it.

# 1. Make Ctrl+C (and thus Super+C) perform Copy
map ctrl+c copy_to_clipboard

# 2. Make Ctrl+V (and thus Super+V) perform Paste
map ctrl+v paste_from_clipboard

# 3. Create a new "Interrupt" key (since we stole Ctrl+C)
# This sends the raw SIGINT signal (\x03 is hex for Ctrl+C)
# Now you use Ctrl+Shift+C to stop running programs.
map ctrl+shift+c send_text all \x03
