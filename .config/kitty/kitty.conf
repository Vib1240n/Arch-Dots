include colors.conf
# Background
background #0d0d0d
background_opacity 0.9
background_blur 30
window_border_width 2pt

# Font
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Cursor
cursor_shape underline
cursor #fea639
cursor_blink_interval 0

# Shell
shell zsh
shell_integration enabled

# Selection/Copy
copy_on_select clipboard

# Terminal type
term xterm-256color

# Window
window_padding_width 15

# Tab bar
tab_bar_edge top
tab_bar_style powerline

# Scrollback
scrollback_lines 100000

# Mouse
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
detect_urls yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Colors (Tokyo Night)
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
color0 #15161e
color8 #414868
color1 #f7768e
color9 #f7768e
color2 #9ece6a
color10 #9ece6a
color3 #e0af68
color11 #e0af68
color4 #7aa2f7
color12 #7aa2f7
color5 #bb9af7
color13 #bb9af7
color6 #7dcfff
color14 #7dcfff
color7 #a9b1d6
color15 #c0caf5

confirm_os_window_close 0

# ══════════════════════════════════════════════════════════════════
# KEYD / MACOS COMPATIBILITY
# ══════════════════════════════════════════════════════════════════
# keyd remaps:
#   Super+C -> Ctrl+C (for copy in GUI apps)
#   Ctrl+C  -> Ctrl+Shift+C (so we can still interrupt)
#
# Kitty mappings:
#   Ctrl+C = copy (receives Super+C via keyd)
#   Ctrl+Shift+C = interrupt (receives Ctrl+C via keyd)
#   Ctrl+V = paste (receives Super+V via keyd)
#   Ctrl+Shift+D = EOF (receives Ctrl+D via keyd)
#   Ctrl+Shift+Z = suspend (receives Ctrl+Z via keyd)
# ══════════════════════════════════════════════════════════════════

# Copy/Paste (Super+C/V arrives as Ctrl+C/V)
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Terminal signals (Ctrl+C/D/Z arrive as Ctrl+Shift+C/D/Z)
map ctrl+shift+c send_text all \x03
map ctrl+shift+d send_text all \x04
map ctrl+shift+z send_text all \x1a

# Reload config
map ctrl+shift+a load_config_file

# Alt+Tab passthrough
map Alt+Tab send_text all \x1b\r
