# MangoHud Configuration
# ~/.config/MangoHud/MangoHud.conf

############## Performance Metrics ##############
fps
fps_sampling_period=500
fps_color_change
fps_value=30,60
fps_color=B22222,FDFD09,39F900

gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_load_change
gpu_load_value=50,90
gpu_load_color=39F900,FDFD09,B22222

cpu_stats
cpu_temp
cpu_power
cpu_mhz
core_load

ram
vram

############## Display Settings ##############
position=top-left
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
reload_cfg=Shift_L+F4

background_alpha=0.4
alpha=0.9

############## Layout ##############
horizontal
table_columns=3
frame_timing=0
frametime=0

############## Font ##############
font_size=24
font_scale=1.0

############## Other ##############
vsync=0
gl_vsync=0
