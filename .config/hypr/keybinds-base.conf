# Hyprland Keybinds - Base Configuration
# Sourced by hyprland.conf
# Last updated: Mar 2026

# Modifiers (keyd provides HYPER via capslock, MEH via left ctrl)
$HYPER = SUPER CTRL ALT SHIFT
$MEH = CTRL ALT SHIFT

# ══════════════════════════════════════════════════════════════════
# Window Focus (HYPER + vim keys)
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, H, movefocus, l
bind = $HYPER, L, movefocus, r
bind = $HYPER, K, movefocus, u
bind = $HYPER, J, movefocus, d

# ══════════════════════════════════════════════════════════════════
# Window Movement (MEH + vim keys)
# ══════════════════════════════════════════════════════════════════
bind = $MEH, H, movewindow, l
bind = $MEH, L, movewindow, r
bind = $MEH, K, movewindow, u
bind = $MEH, J, movewindow, d

# ══════════════════════════════════════════════════════════════════
# Workspace Switching (HYPER + number)
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, 1, workspace, 1
bind = $HYPER, 2, workspace, 2
bind = $HYPER, 3, workspace, 3
bind = $HYPER, 4, workspace, 4
bind = $HYPER, 5, workspace, 5
bind = $HYPER, 6, workspace, 6
bind = $HYPER, 7, workspace, 7
bind = $HYPER, 8, workspace, 8
bind = $HYPER, 9, workspace, 9
bind = $HYPER, 0, workspace, 10

# ══════════════════════════════════════════════════════════════════
# Move Window to Workspace (MEH + number)
# ══════════════════════════════════════════════════════════════════
bind = $MEH, 1, movetoworkspace, 1
bind = $MEH, 2, movetoworkspace, 2
bind = $MEH, 3, movetoworkspace, 3
bind = $MEH, 4, movetoworkspace, 4
bind = $MEH, 5, movetoworkspace, 5
bind = $MEH, 6, movetoworkspace, 6
bind = $MEH, 7, movetoworkspace, 7
bind = $MEH, 8, movetoworkspace, 8
bind = $MEH, 9, movetoworkspace, 9
bind = $MEH, 0, movetoworkspace, 10

# ══════════════════════════════════════════════════════════════════
# Window Management
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, Q, killactive
bind = $HYPER, M, fullscreen, 1
bind = $MEH, F, togglefloating

# Resize mode
bind = $HYPER, R, submap, resize
submap = resize
binde = , H, resizeactive, -50 0
binde = , J, resizeactive, 0 50
binde = , K, resizeactive, 0 -50
binde = , L, resizeactive, 50 0
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# ══════════════════════════════════════════════════════════════════
# Application Launchers (HYPER)
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, T, exec, kitty
bind = $HYPER, B, exec, zen-browser
bind = $HYPER, Z, exec, zed
bind = $HYPER, D, exec, discord
bind = $HYPER, Return, exec, ~/.local/bin/open-file-manager

# Launcher
bind = $HYPER, space, exec, launch-gui toggle

# Clipboard
bind = $HYPER, V, exec, cliphist-gui toggle

# ══════════════════════════════════════════════════════════════════
# Special Workspace
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, U, togglespecialworkspace, hidden
bind = $HYPER, equal, togglespecialworkspace
bind = $MEH, U, movetoworkspace, special:hidden
bind = $MEH, minus, movetoworkspace, special
bind = $HYPER, Tab, workspace, previous

# ══════════════════════════════════════════════════════════════════
# Layout Toggle
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, Y, exec, ~/.config/hypr/scripts/toggle-layout.sh

# ══════════════════════════════════════════════════════════════════
# Mouse Bindings (HYPER since SUPER is cmd layer)
# ══════════════════════════════════════════════════════════════════
bindm = $HYPER, mouse:272, movewindow
bindm = $HYPER, mouse:273, resizewindow
bind = $HYPER, mouse_down, workspace, e+1
bind = $HYPER, mouse_up, workspace, e-1

# ══════════════════════════════════════════════════════════════════
# Lock / Sleep / Hibernate
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, Escape, exec, hyprlock & sleep 0.2
bind = $MEH, Escape, exec, systemctl suspend

# ══════════════════════════════════════════════════════════════════
# Utilities
# ══════════════════════════════════════════════════════════════════
bind = $HYPER, BackSpace, exec, ~/Development/bash_scripts/toggle-caffeinate.sh
bind = $HYPER, W, exec, ~/.config/hypr/scripts/WallpaperSelect.sh
bind = $HYPER, P, exec, ags quit && ags run ~/.config/ags/bar.tsx > /dev/null 2>&1 &
# ══════════════════════════════════════════════════════════════════
# Screenshots (macOS style - Super+Shift+3/4/5)
# keyd passes these through as SUPER+SHIFT+3/4/5
# ══════════════════════════════════════════════════════════════════
bind = SUPER SHIFT, 3, exec, ~/.config/hypr/scripts/Screenshot.sh full
bind = SUPER SHIFT, 4, exec, ~/.config/hypr/scripts/Screenshot.sh area
# bind = SUPER SHIFT, 5, exec, ~/.config/hypr/scripts/Screenshot.sh record

# ══════════════════════════════════════════════════════════════════
# Audio Switcher (rust-widgets)
# ══════════════════════════════════════════════════════════════════
bind = ALT, A, exec, rw toggle volume

# ══════════════════════════════════════════════════════════════════
# Media Keys
# ══════════════════════════════════════════════════════════════════
bindl = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/Volume.sh up
bindl = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/Volume.sh down
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/Volume.sh mute
bindl = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/Brightness.sh up
bindl = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/Brightness.sh down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# VIA remapped keys (F13/F14/F15)
bindl = , F13, exec, ~/.config/hypr/scripts/Volume.sh up
bindl = , F14, exec, ~/.config/hypr/scripts/Volume.sh down
bindl = , F15, exec, ~/.config/hypr/scripts/Volume.sh mute

# ══════════════════════════════════════════════════════════════════
# rust-widgets
# ══════════════════════════════════════════════════════════════════
bind = ALT, B, exec, rw toggle stats
