# ===========================================================================
# Hyprland layer rules - Generated by theme-switcher
# Palette: Material You Glass   Visual: apple
# Source from hyprland.conf with:
#   source = ~/.config/hypr/layerrules-themed.conf
# ===========================================================================

# AGS bar
layerrule = blur on, ignore_alpha 0.3, match:namespace ags-bar

# cliphist-gui
layerrule = blur on, ignore_alpha 0.5, match:namespace cliphist-gui

# launch-gui
layerrule = blur on, ignore_alpha 0.3, match:namespace launch-gui

# rust-widgets (control-center, stats-popup, media-player, volume-control, notification-center)
layerrule = blur on, ignore_alpha 0.05, match:namespace rust-widgets

# rust-widgets popups (volume OSD, brightness OSD, notification popups)
layerrule = blur on, ignore_alpha 0.075, xray 0, blur_popups on, match:namespace rust-widgets-popup
