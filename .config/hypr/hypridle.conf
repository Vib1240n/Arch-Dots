general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pkill -9 hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on && (pidof hyprlock || hyprlock)
    ignore_dbus_inhibit = false
}

# Warning: Screen about to dim (30s warning)
listener {
    timeout = 270
    on-timeout = notify-send "Idle Warning" "Screen will dim in 30 seconds" -u normal -t 5000
}

# Dim screen after 5 minutes
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10% && notify-send "Screen Dimmed" "Screen brightness reduced to 10%" -u low -t 3000
    on-resume = brightnessctl -r
}

# Warning: Screen about to lock (30s warning)
listener {
    timeout = 570
    on-timeout = notify-send "Idle Warning" "Screen will lock in 30 seconds" -u critical -t 5000
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session && notify-send "Screen Locked" "Session has been locked" -u normal -t 3000
}

# Warning: Display turning off soon (30s warning)
listener {
    timeout = 630
    on-timeout = notify-send "Idle Warning" "Display turning off in 30 seconds" -u normal -t 5000
}

# Turn off screen after 11 minutes
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && notify-send "Display On" "Display has been turned back on" -u low -t 2000
}

# Warning: System about to suspend (30s warning)
listener {
    timeout = 1170
    on-timeout = notify-send "Suspend Warning" "System will suspend in 30 seconds" -u critical -t 5000
}

# Suspend after 20 minutes
listener {
    timeout = 1200
    on-timeout = "$(cat /sys/class/power_supply/BAT*/status 2>/dev/null)" = "Discharging" ] && systemctl suspend
}
