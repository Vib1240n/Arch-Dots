# ============================================================================
# hypridle.conf
# ----------------------------------------------------------------------------
# Notes for this revision:
#   - The suspend listener had a bug: missing opening `[` on the test command.
#     Fixed below.
#   - `before_sleep_cmd = pkill -9 hyprlock` is from your Dell era and is no
#     longer needed on the MSI with NVIDIA sleep services. Replaced with the
#     simpler `loginctl lock-session`. If you have hibernate issues again, you
#     can swap it back.
# ============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session && sleep 2
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ----------------------------------------------------------------------------
# Idle timeline (battery- and AC-aware)
# ----------------------------------------------------------------------------

# 4:30 - dim warning
listener {
    timeout = 270
    on-timeout = notify-send "Idle Warning" "Screen will dim in 30 seconds" -u normal -t 5000
}

# 5:00 - dim screen
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10% && notify-send "Screen Dimmed" "Screen brightness reduced to 10%" -u low -t 3000
    on-resume = brightnessctl -r
}

# 9:30 - lock warning
listener {
    timeout = 570
    on-timeout = notify-send "Idle Warning" "Screen will lock in 30 seconds" -u critical -t 5000
}

# 10:00 - lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session && notify-send "Screen Locked" "Session has been locked" -u normal -t 3000
}

# 10:30 - dpms warning
listener {
    timeout = 630
    on-timeout = notify-send "Idle Warning" "Display turning off in 30 seconds" -u normal -t 5000
}

# 11:00 - dpms off
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && notify-send "Display On" "Display has been turned back on" -u low -t 2000
}

# 19:30 - suspend warning
listener {
    timeout = 1170
    on-timeout = notify-send "Suspend Warning" "System will suspend in 30 seconds" -u critical -t 5000
}

# 20:00 - suspend (battery only)
# FIX: original had broken bash test syntax (missing opening `[`).
# This version correctly checks if AC is unplugged before suspending.
listener {
    timeout = 1200
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/BAT*/status 2>/dev/null)" = "Discharging" ] && systemctl suspend'
}
