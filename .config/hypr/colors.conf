# ===========================================================================
# hyprland colors - Generated by theme-switcher
# Palette: Material You Glass   Visual: apple
# Source from hyprland.conf with:  source = ~/.config/hypr/colors.conf
# ===========================================================================

general {
    col.active_border   = rgb(3daee9) rgb(7aa2f7) 45deg
    col.inactive_border = rgba(57595caa)
    border_size         = 2
}

decoration {
    rounding = 12
    shadow {
        enabled       = true
        range         = 12
        render_power  = 3
        color         = rgba(00000066)
        color_inactive = rgba(00000066)
    }
}

group {
    col.border_active   = rgb(3daee9)
    col.border_inactive = rgba(57595caa)
    groupbar {
        col.active   = rgb(3daee9)
        col.inactive = rgba(292c30aa)
        text_color   = rgb(fcfcfc)
    }
}
