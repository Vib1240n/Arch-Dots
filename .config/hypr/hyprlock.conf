# Hyprlock config matching SilentSDDM theme
# Place this at ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# Background - same as SDDM
background {
    monitor =
    path = ~/Pictures/wallpapers/Space(Landscape)/amir-zand-detach-copy.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 1.0
    contrast = 1.0
    vibrancy = 1.0
}

# User avatar - circular with peach/salmon border
image {
    monitor =
    path = /var/lib/AccountsService/icons/vib1240n
    size = 120
    rounding = -1
    border_size = 5
    border_color = rgba(232, 162, 142, 1.0)
    
    position = 0, 100
    halign = center
    valign = center
}

# Username below avatar
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 0
    halign = center
    valign = center
}

# Lock icon to the left of password field
label {
    monitor =
    text =  
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    
    position = -100, -60
    halign = center
    valign = center
}

# Password input field - dark rounded style matching SDDM
input-field {
    monitor =
    size = 320, 45
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(30, 30, 30, 0.85)
    font_color = rgba(255, 255, 255, 0.7)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>    Password</i>
    hide_input = false
    rounding = 20
    check_color = rgba(232, 162, 142, 1.0)
    fail_color = rgba(255, 100, 100, 1.0)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgba(255, 200, 100, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -60
    halign = center
    valign = center
}

# Arrow icon to the right of password field
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    
    position = 100, -60
    halign = center
    valign = center
}
