# ═══════════════════════════════════════════════════════════════════════════════
# HYPRLAND CONFIG - SeaGlass Style (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════
source = ~/.config/hypr/keybinds-base.conf
source = ~/.config/hypr/keybinds-active.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart-active.conf
# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT
# ═══════════════════════════════════════════════════════════════════════════════
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt5ct

# ═══════════════════════════════════════════════════════════════════════════════
# AUTOSTART
# ═══════════════════════════════════════════════════════════════════════════════
# exec-once = waybar
# exec-once = swaync
exec-once = zlaunch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swww-daemon
exec-once = sleep 3 && swww img "$(cat ~/.cache/current-wallpaper 2>/dev/null || echo ~/Pictures/wallpapers/default.jpg)"
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = easyeffects &
exec-once = udiskie --automount --notify &
# ═══════════════════════════════════════════════════════════════════════════════
# VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
$terminal = kitty
$fileManager = nemo
$menu = rofi -show drun

# ═══════════════════════════════════════════════════════════════════════════════
# INPUT
# ═══════════════════════════════════════════════════════════════════════════════
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    
    touchpad {
        natural_scroll = true
        tap-to-click = false
        drag_lock = false
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════════════════════════════════════════════
general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3
    col.active_border = rgb(00b8ff) rgb(001eff) rgb(bd00ff) rgb(d600ff) 30deg
    col.inactive_border = rgb(313244)
    layout = dwindle
    resize_on_border = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# DECORATION - OPTIMIZED FOR INTEL iGPU
# ═══════════════════════════════════════════════════════════════════════════════
decoration {
    rounding = 15
    active_opacity = 0.75
    inactive_opacity = 0.65
    
    blur {
        enabled = true
        size = 6
        passes = 5
        noise = 0.01
        new_optimizations = true
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        xray = false
        popups = true
        popups_ignorealpha = 0.6
        ignore_opacity = true
    }
    
    shadow {
        enabled = false
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# ANIMATIONS - OPTIMIZED FOR PERFORMANCE
# ═══════════════════════════════════════════════════════════════════════════════
animations {
    enabled = true
    bezier = fast, 0.1, 0.9, 0.1, 1.0
    
    animation = windows, 1, 3, fast, slide
    animation = windowsOut, 1, 2, fast, slide
    animation = border, 0
    animation = borderangle, 0
    animation = fade, 1, 3, fast
    animation = workspaces, 1, 3, fast, slide
    animation = layers, 1, 2, fast, fade
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAYOUT
# ═══════════════════════════════════════════════════════════════════════════════
dwindle {
    pseudotile = true
    preserve_split = false
    force_split = 2
}

master {
    new_status = master
}

# ═══════════════════════════════════════════════════════════════════════════════
# MISC - PERFORMANCE OPTIMIZATIONS
# ═══════════════════════════════════════════════════════════════════════════════
misc {
    vfr = true
    vrr = 0
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════════════════════════════════════════
cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
    hide_on_key_press = false
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAYER RULES (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace fuzzel
layerrule = blur on, match:namespace zlaunch
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace eww
layerrule = blur on, match:namespace eww-spotify

layerrule = ignore_alpha 0, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace fuzzel
layerrule = ignore_alpha 0.75, match:namespace zlaunch
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace eww
layerrule = ignore_alpha 0, match:namespace eww-spotify
# layerrule = opacity 0.3, match:namespace eww-spotify
# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW RULES (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════

# General floating windows
windowrule = float on, match:class ^$
windowrule = float on, match:title ^$
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrulev2 = noscale, class:^(bambu-studio)$
# Zen browser - NO TRANSPARENCY
windowrule = opacity 1.0 override, match:class ^(zen)$
windowrule = opacity 1.0 override, match:class ^(BambuStudio)$
windowrule = pin on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$

# Plex - NO TRANSPARENCY
windowrule = opacity 1.0 override, match:class ^(Plex)$
windowrule = opacity 1.0 override, match:initial_class ^(Plex)$
windowrule = opacity 1.0 override, match:class ^(org.jellyfin.JellyfinDesktop)$
windowrule = opacity 1.0 override, match:initial_class ^(org.jellyfin.JellyfinDesktop)$

# Clipse clipboard
windowrule = float on, match:class clipse
windowrule = size 900 700, match:class clipse
windowrule = center on, match:class clipse
windowrule = opacity 0.85 override, match:class clipse

# Floating countdown
windowrule = float on, match:class ^(floating-countdown)$
windowrule = center on, match:class ^(floating-countdown)$
windowrule = size 400 200, match:class ^(floating-countdown)$
windowrule = pin on, match:class ^(floating-countdown)$

# IMV (Image viewer) - macOS Quick Look style
windowrule = float on, match:class ^(imv)$
windowrule = center on, match:class ^(imv)$
windowrule = size 60% 70%, match:class ^(imv)$
windowrule = opacity 0.9 override, match:class ^(imv)$
windowrule = dim_around on, match:class ^(imv)$
windowrule = border_color rgb(00aaff), match:class ^(imv)$

# ═══════════════════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS (0.53+ SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════

# Terminal & Code -> Workspace 1
windowrule = workspace 1 silent, match:class ^(kitty)$
windowrule = workspace 1 silent, match:class ^(Alacritty)$
windowrule = workspace 1 silent, match:class ^(Code)$
windowrule = workspace 1 silent, match:class ^(Zed)$

# Browser -> Workspace 2
windowrule = workspace 2 silent, match:class ^(firefox)$
windowrule = workspace 2 silent, match:class ^(Firefox)$
windowrule = workspace 2 silent, match:class ^(zen)$
windowrule = workspace 2 silent, match:class ^(google-chrome)$
windowrule = workspace 2 silent, match:class ^(chromium)$

# Communication -> Workspace 3
windowrule = workspace 3 silent, match:class ^(discord)$
windowrule = workspace 3 silent, match:class ^(Discord)$
windowrule = workspace 3 silent, match:class ^(vesktop)$
windowrule = workspace 3 silent, match:class ^(Vesktop)$
windowrule = workspace 3 silent, match:class ^(slack)$

# BambuStudio -> Workspace 5
windowrule = workspace 5 silent, match:class ^(BambuStudio)$

# Bind workspaces to monitors
workspace = 1, monitor:desc:Dell Inc. AW3423DWF J98H2S3, default:true
workspace = 2, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 3, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 4, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 5, monitor:desc:Dell Inc. AW3423DWF J98H2S3

workspace = 6, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ, default:true
workspace = 7, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ
workspace = 8, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ
