# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT
# ═══════════════════════════════════════════════════════════════════════════════
env = PATH,$HOME/.local/bin:$PATH
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,Fusion
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# ═══════════════════════════════════════════════════════════════════════════════
# HYPRLAND CONFIG - SeaGlass Style (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════
source = ~/.config/hypr/keybinds-base.conf
source = ~/.config/hypr/layerrules.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/macro_layer1.conf
source = ~/.config/hypr/colors.conf
# ═══════════════════════════════════════════════════════════════════════════════
# VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
$terminal = kitty
$fileManager = nemo
$menu = rofi -show drun

# ═══════════════════════════════════════════════════════════════════════════════
# INPUT
# ═══════════════════════════════════════════════════════════════════════════════
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = false
        drag_lock = false
        disable_while_typing = true
        clickfinger_behavior = true
    }
}
device {
    name = wl-wlmouse*
    natural_scroll = true
}
# ═══════════════════════════════════════════════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════════════════════════════════════════════
general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3
    col.active_border = rgb(00b8ff) rgb(001eff) rgb(bd00ff) rgb(d600ff) 30deg
    col.inactive_border = rgb(313244)
    layout = dwindle
    resize_on_border = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# DECORATION - OPTIMIZED FOR INTEL iGPU
# ═══════════════════════════════════════════════════════════════════════════════
decoration {
    rounding = 15
    active_opacity = 0.75
    inactive_opacity = 0.65
    
    blur {
        enabled = true
        size = 6
        passes = 5
        noise = 0.01
        new_optimizations = true
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        xray = false
        popups = true
        popups_ignorealpha = 0.6
        ignore_opacity = true
    }
    
    shadow {
        enabled = false
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# ANIMATIONS - OPTIMIZED FOR PERFORMANCE
# ═══════════════════════════════════════════════════════════════════════════════
animations {
    enabled = true
    bezier = fast, 0.1, 0.9, 0.1, 1.0
    
    animation = windows, 1, 3, fast, slide
    animation = windowsOut, 1, 2, fast, slide
    animation = border, 0
    animation = borderangle, 0
    animation = fade, 1, 3, fast
    animation = workspaces, 1, 3, fast, slide
    animation = layers, 1, 2, fast, fade
}

# ═══════════════════════════════════════════════════════════════════════════════
# LAYOUT
# ═══════════════════════════════════════════════════════════════════════════════
 dwindle {
      force_split                  = 0
      preserve_split               = false
      smart_split                  = false
      smart_resizing               = true
      permanent_direction_override = false
      special_scale_factor         = 1
      split_width_multiplier       = 1.0
      use_active_for_splits        = true
      default_split_ratio          = 1.0
      split_bias                   = 0
      precise_mouse_move           = false
  }
master {
    new_status = master
}

# ═══════════════════════════════════════════════════════════════════════════════
# MISC - PERFORMANCE OPTIMIZATIONS
# ═══════════════════════════════════════════════════════════════════════════════
misc {
    # vfr = true
    vrr = 0
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

# ═══════════════════════════════════════════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════════════════════════════════════════
cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
    hide_on_key_press = false
}


