# ============================================================================
# Macropad - Layer 1 (General Purpose) bindings
# ----------------------------------------------------------------------------
# Source from your main keybinds file (keybinds-base.conf) with:
#   source = ~/.config/hypr/macropad-layer1.conf
#
# Row 2 (workspace toggles) is intentionally NOT bound here. The macropad
# emits the same chords your keyboard already does (HYPR+U, HYPR+equal),
# so your existing binds in keybinds-base.conf handle them. No duplication.
#
# Row 3 and Row 4 use HYPR + F13..F20. F21..F24 are deliberately avoided:
# F24 is consumed by keyd's gaming-mode toggle, and we keep F21..F23 free
# for future use without overlapping that gaming key range.
# ============================================================================


# ----------------------------------------------------------------------------
# Row 3 - Audio + custom widgets
# ----------------------------------------------------------------------------

# R3-1: Cycle audio output sink
bind = ,code:191, exec, ~/.config/hypr/scripts/macro_audiocycle.sh

# R3-2: Toggle EasyEffects
bind = ,code:192, exec, ~/.config/hypr/scripts/macro_easyeffect.sh

# R3-3: Toggle rust-widgets control center
bind = , F23, exec, rw toggle control

# R3-4: Toggle rust-widgets volume widget
bind = , F24, exec, rw toggle volume

bind = , code:190, exec, systemctl hibernate
# bind = , F21, exec, systemctl hibernate
# ----------------------------------------------------------------------------
# Row 4 - Power management
# ----------------------------------------------------------------------------

# # R4-1: Lock
# bind = $HYPER, F17, exec, hyprlock
#
# # R4-2: Suspend (sleep to RAM)
# bind = $HYPER, F18, exec, systemctl suspend
#
# # R4-3: Suspend-then-hibernate
# bind = $HYPER, F19, exec, systemctl suspend-then-hibernate
#
# # R4-4: Hibernate (requires double-tap within 1.5s)
# bind = $HYPER, F20, exec, ~/.config/hypr/scripts/macro_hibernate.sh
bind = , code:195, exec, hyprlock
bind = , code:196, exec, systemctl suspend
bind = , code:197, exec, systemctl suspend-then-hibernate
bind = , code:198, exec, ~/.config/hypr/scripts/macro_hibernate.sh
