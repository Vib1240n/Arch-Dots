# Disable Laptop Screen
# monitor = eDP-1, 1920x1200@120, 0x0, 1.0
monitor = eDP-1, disabled

# Dell Ultrawide (DP-3) - Primary, centered vertically
# Position: Start at x=0, vertically centered with HP monitor
# HP is 2560 tall when rotated, Dell is 1440 tall
# Vertical offset: (2560 - 1440) / 2 = 560
# monitor = desc:Dell Inc. AW3423DWF J98H2S3, 3440x1440@164.90, 0x1440, 1.0
monitor = desc:Dell Inc. AW3423DWF J98H2S3, 3440x1440@164.90, 0x1440, 1.0
monitor = desc:HP Inc. OMEN 27qs CNC33116XQ, 2560x1440@120, 1440x0, 1
# HP OMEN (DP-4) - Vertical, to the right of Dell
# Position: Dell width is 3440, so HP starts at x=3440
# After rotation (transform 3): 1440 wide × 2560 tall
# monitor = desc:HP Inc. OMEN 27qs CNC33116XQ, 2560x1440@240.00, 1440x0, 1 

# Lid switch behavior
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-close.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-open.sh

