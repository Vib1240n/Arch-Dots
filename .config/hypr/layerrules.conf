# ═══════════════════════════════════════════════════════════════════════════════
# LAYER RULES (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace fuzzel
layerrule = blur on, match:namespace zlaunch
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace eww
layerrule = blur on, match:namespace eww-spotify
layerrule = blur on, match:namespace nucleus:bar
layerrule = blur on, match:namespace nucleus:bar
layerrule = blur on, match:namespace nucleus:sidebarleft
layerrule = blur on, match:namespace nucleus:notification
layerrule = ignore_alpha 0, match:namespace nucleus:notification
layerrule = ignore_alpha 0, match:namespace nucleus:bar
layerrule = ignore_alpha 0, match:namespace nucleus:sidebarleft
# layerrule = ignore_alpha 0.5, match:namespace nucleus:bar
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace fuzzel
layerrule = ignore_alpha 0.75, match:namespace zlaunch
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace eww
layerrule = ignore_alpha 0, match:namespace eww-spotify
# layerrule = opacity 0.3, match:namespace eww-spotify
layerrule = blur on, match:namespace cliphist-gui
layerrule = blur on, match:namespace launch-gui
layerrule = ignore_alpha 0.3, match:namespace cliphist-gui
layerrule = ignore_alpha 0.3, match:namespace launch-gui
layerrule = blur on, match:namespace rust-widgets
# layerrule = ignore_alpha 0.1, match:namespace rust-widgets
layerrule = ignore_alpha 0.1, match:namespace rust-widgets
layerrule = animation slide, match:namespace rust-widgets
layerrule = blur on, match:namespace rust-widgets-popup
layerrule = ignore_alpha 0.3, match:namespace rust-widgets-popup
layerrule = animation slide, match:namespace rust-widgets-popup
# AGS Bar blur
layerrule = blur on, match:namespace ags-bar
layerrule = ignore_alpha 0.3, match:namespace ags-bar
layerrule = xray 0, match:namespace ags-bar
