# Shared autostart - runs regardless of shell
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = easyeffects &
exec-once = udiskie --automount --notify &

# Waybar shell autostart
exec-once = waybar
exec-once = swww-daemon
exec-once = sleep 3 && swww img "$(cat ~/.cache/current-wallpaper 2>/dev/null || echo ~/Pictures/wallpapers/default.jpg)"

# rust-widgets daemons
exec-once = rw-volume-osd
exec-once = rw-notifications

# GUI launchers
exec-once = cliphist-gui
exec-once = launch-gui
