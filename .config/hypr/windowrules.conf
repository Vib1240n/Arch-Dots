# ═══════════════════════════════════════════════════════════════════════════════
# WINDOW RULES (0.53+ CORRECT SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════

# General floating windows
windowrule = float on, match:class ^$
windowrule = float on, match:title ^$
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Picture-in-Picture)$
# windowrule = match:class ^(bambu-studio)$, noscale 1
# Zen browser - NO TRANSPARENCY
windowrule = opacity 1.0 override, match:class ^(zen)$
windowrule = opacity 1.0 override, match:class ^(BambuStudio)$
windowrule = pin on, match:class ^(zen)$, match:title ^(Picture-in-Picture)$

# Plex - NO TRANSPARENCY
windowrule = opacity 1.0 override, match:class ^(Plex)$
windowrule = opacity 1.0 override, match:class ^(opera)$
windowrule = opacity 1.0 override, match:class ^(Opera)$
windowrule = opacity 1.0 override, match:class ^(firefox)$
windowrule = opacity 1.0 override, match:initial_class ^(Plex)$
windowrule = opacity 1.0 override, match:class ^(org.jellyfin.JellyfinDesktop)$
windowrule = opacity 1.0 override, match:initial_class ^(org.jellyfin.JellyfinDesktop)$

# Clipse clipboard
windowrule = float on, match:class clipse
windowrule = size 900 700, match:class clipse
windowrule = center on, match:class clipse
windowrule = opacity 0.85 override, match:class clipse

# Floating countdown
windowrule = float on, match:class ^(floating-countdown)$
windowrule = center on, match:class ^(floating-countdown)$
windowrule = size 400 200, match:class ^(floating-countdown)$
windowrule = pin on, match:class ^(floating-countdown)$

# IMV (Image viewer) - macOS Quick Look style
windowrule = float on, match:class ^(imv)$
windowrule = center on, match:class ^(imv)$
windowrule = size 60% 70%, match:class ^(imv)$
windowrule = opacity 0.9 override, match:class ^(imv)$
windowrule = dim_around on, match:class ^(imv)$
windowrule = border_color rgb(00aaff), match:class ^(imv)$

# ═══════════════════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS (0.53+ SYNTAX)
# ═══════════════════════════════════════════════════════════════════════════════

# Terminal & Code -> Workspace 1
windowrule = workspace 1 silent, match:class ^(kitty)$
windowrule = workspace 1 silent, match:class ^(Alacritty)$
windowrule = workspace 1 silent, match:class ^(Code)$
windowrule = workspace 1 silent, match:class ^(Zed)$

# Browser -> Workspace 2
windowrule = workspace 2 silent, match:class ^(firefox)$
windowrule = workspace 2 silent, match:class ^(Firefox)$
windowrule = workspace 2 silent, match:class ^(zen)$
windowrule = workspace 2 silent, match:class ^(Opera)$
windowrule = workspace 2 silent, match:class ^(google-chrome)$
windowrule = workspace 2 silent, match:class ^(chromium)$

# Communication -> Workspace 3
windowrule = workspace special:hidden silent, match:class ^(discord)$
windowrule = workspace special:hidden silent, match:class ^(Discord)$
windowrule = workspace special:hidden silent, match:class ^(vesktop)$
windowrule = workspace special:hidden silent, match:class ^(Vesktop)$
windowrule = workspace special:hidden silent, match:class ^(slack)$

# BambuStudio -> Workspace 5
windowrule = workspace 5 silent, match:class ^(BambuStudio)$

# Bind workspaces to monitors
workspace = 1, monitor:desc:Dell Inc. AW3423DWF J98H2S3, default:true
workspace = 2, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 3, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 4, monitor:desc:Dell Inc. AW3423DWF J98H2S3
workspace = 5, monitor:desc:Dell Inc. AW3423DWF J98H2S3

workspace = 6, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ, default:true
workspace = 7, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ
workspace = 8, monitor:desc:HP Inc. OMEN 27qs CNC33116XQ


# Discord - NO TRANSPARENCY (0.53+ syntax)
windowrule = opacity 1.0 override 1.0 override, match:class ^(discord)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(Discord)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(vesktop)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(Vesktop)$
