[ids]
*

[main]
capslock = overload(hyper, noop)
leftshift = overload(shift, enter)
leftcontrol = overload(meh, leftcontrol)

# --- NEW: Assign Left Super to the Mac Layer ---
leftmeta = layer(mac_layer)

# --- NEW: Define the Mac Layer ---
# ":M" means it inherits Meta behavior for keys not listed here.
# This ensures Super+1 (Hyprland) still works as Super+1.
[mac_layer:M]
c = C-c
v = C-v
x = C-x
z = C-z

 --- Existing Layers ---
[hyper:C-A-S-M]

[meh:C-A-S]
