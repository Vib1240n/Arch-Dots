[ids]
*

[global]
overload_tap_timeout = 200

[main]

# ----------------------------------------------------------
# Mac-style shortcuts: Super becomes Control layer
# Holding Super + key = Ctrl + key (copy, paste, save, etc.)
# ----------------------------------------------------------
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# ----------------------------------------------------------
# Hyper key: Capslock held = Ctrl+Alt+Shift+Super
# Used for Hyprland window management binds
# ----------------------------------------------------------
capslock = overload(hyper, noop)

# ----------------------------------------------------------
# Meh key: Left Control held = Ctrl+Alt+Shift
# Used for Hyprland window swapping / move-to-workspace
# ----------------------------------------------------------
leftcontrol = overload(meh, leftcontrol)

# ----------------------------------------------------------
# Tap left shift for Enter
# ----------------------------------------------------------
leftshift = overload(shift, enter)

# ----------------------------------------------------------
# Media keys passthrough
# ----------------------------------------------------------
volumeup = volumeup
volumedown = volumedown
mute = mute

# ----------------------------------------------------------
# Gaming mode toggle
# ----------------------------------------------------------
f24 = toggle(gaming)

# ----------------------------------------------------------
# Mac Command Layer
# Inherits Control modifier (:C), so any key not explicitly
# mapped here will emit Ctrl+<key> automatically.
# e.g. Super+C = Ctrl+C, Super+V = Ctrl+V, etc.
#
# Keys that need to NOT be Ctrl+key are explicitly overridden.
# ----------------------------------------------------------
[cmd:C]

# Text navigation (Mac-style)
# Super+Left/Right = Home/End (beginning/end of line)
left = home
right = end

# Super+Shift+Left/Right = Select to beginning/end of line
shift+left = S-home
shift+right = S-end

# Super+Up/Down = Top/Bottom of document
up = C-home
down = C-end

# Super+Backspace = Delete entire line (to beginning)
backspace = macro(home S-end delete)

# ----------------------------------------------------------
# Gaming mode: all keys behave normally
# ----------------------------------------------------------
[gaming]
capslock = capslock
leftshift = leftshift
leftcontrol = leftcontrol
leftmeta = leftmeta
f24 = toggle(gaming)

# ----------------------------------------------------------
# Hyper layer: Ctrl+Alt+Shift+Super
# ----------------------------------------------------------
[hyper:C-A-S-M]

# ----------------------------------------------------------
# Meh layer: Ctrl+Alt+Shift
# ----------------------------------------------------------
[meh:C-A-S]
